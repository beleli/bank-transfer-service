services:

  kafka:
    image: apache/kafka:3.7.0
    container_name: bank-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - ./docker/kafka:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 5

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: bank-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Aguardando Kafka..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic transfer-requested --partitions 3 --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic transfer-completed --partitions 3 --replication-factor 1

        echo "Tópicos do Kafka configurados com sucesso:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: bank-schema-registry
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 5

  schema-registry-init:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: bank-schema-registry-init
    depends_on:
      schema-registry:
        condition: service_healthy
    volumes:
      - ./src/main/avro:/tmp/avro:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Registrando schemas no Confluent Schema Registry..."
        python3 - << 'EOF'
        import json, urllib.request, time, sys

        schema_file = "/tmp/avro/transfer_request_event.avsc"
        subject = "transfer-requested-value"
        url = f"http://schema-registry:8081/subjects/{subject}/versions"

        with open(schema_file, "r") as f:
            schema_data = json.load(f)

        payload = json.dumps({"schema": json.dumps(schema_data)}).encode("utf-8")
        req = urllib.request.Request(
            url,
            data=payload,
            headers={"Content-Type": "application/vnd.schemaregistry.v1+json"}
        )

        success = False
        for attempt in range(1, 31):
            try:
                with urllib.request.urlopen(req) as resp:
                    print(f"Schema registrado com sucesso para subject '{subject}': {resp.read().decode()}")
                    success = True
                    break
            except Exception as e:
                print(f"Tentativa {attempt}/30: aguardando Schema Registry ({e})...")
                time.sleep(2)

        if not success:
            sys.exit(1)

        try:
            with urllib.request.urlopen("http://schema-registry:8081/subjects") as resp:
                print("Subjects ativos no Schema Registry:", resp.read().decode())
        except Exception as e:
            print("Erro ao listar subjects:", e)
        EOF

  localstack:
    image: localstack/localstack:3.0.0
    container_name: bank-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,sqs
      - AWS_DEFAULT_REGION=us-east-1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - ./docker/localstack:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  aws-init:
    image: amazon/aws-cli:latest
    container_name: bank-aws-init
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Aguardando LocalStack..."
        aws --endpoint-url=http://localstack:4566 dynamodb create-table \
          --table-name accounts \
          --attribute-definitions AttributeName=accountId,AttributeType=S \
          --key-schema AttributeName=accountId,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST || true

        aws --endpoint-url=http://localstack:4566 dynamodb create-table \
          --table-name transactions \
          --attribute-definitions AttributeName=transferId,AttributeType=S \
          --key-schema AttributeName=transferId,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST || true

        aws --endpoint-url=http://localstack:4566 sqs create-queue \
          --queue-name transfer-failed || true

        echo "Populando contas de exemplo..."
        aws --endpoint-url=http://localstack:4566 dynamodb put-item \
          --table-name accounts \
          --item '{"accountId": {"S": "acc-123"}, "balance": {"N": "5000.00"}, "currency": {"S": "BRL"}, "status": {"S": "ACTIVE"}, "customerName": {"S": "João Silva"}}'
        
        aws --endpoint-url=http://localstack:4566 dynamodb put-item \
          --table-name accounts \
          --item '{"accountId": {"S": "acc-456"}, "balance": {"N": "1200.50"}, "currency": {"S": "BRL"}, "status": {"S": "ACTIVE"}, "customerName": {"S": "Maria Santos"}}'

        aws --endpoint-url=http://localstack:4566 dynamodb put-item \
          --table-name accounts \
          --item '{"accountId": {"S": "acc-789"}, "balance": {"N": "300.00"}, "currency": {"S": "BRL"}, "status": {"S": "ACTIVE"}, "customerName": {"S": "Pedro Costa"}}'

        aws --endpoint-url=http://localstack:4566 dynamodb put-item \
          --table-name accounts \
          --item '{"accountId": {"S": "acc-000"}, "balance": {"N": "0.00"}, "currency": {"S": "BRL"}, "status": {"S": "INACTIVE"}, "customerName": {"S": "Conta Encerrada"}}'
        
        echo "Setup concluído com sucesso!"
